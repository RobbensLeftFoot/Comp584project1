<!DOCTYPE html>
<html lang="en">
	<head>
		<title></title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<style type="text/css">
      /* CLIENT-SPECIFIC STYLES */
			body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
			table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
			img { -ms-interpolation-mode: bicubic; }
			
			/* RESET STYLES */
			img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
			table { border-collapse: collapse !important; }
			body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
			
			/* iOS BLUE LINKS */
			a[x-apple-data-detectors] {
			    color: inherit !important;
			    text-decoration: none !important;
			    font-size: inherit !important;
			    font-family: inherit !important;
			    font-weight: inherit !important;
			    line-height: inherit !important;
			}
			
			/* GMAIL BLUE LINKS */
			u + #body a {
			    color: inherit;
			    text-decoration: none;
			    font-size: inherit;
			    font-family: inherit;
			    font-weight: inherit;
			    line-height: inherit;
			}
			
			/* SAMSUNG MAIL BLUE LINKS */
			#MessageViewBody a {
			    color: inherit;
			    text-decoration: none;
			    font-size: inherit;
			    font-family: inherit;
			    font-weight: inherit;
			    line-height: inherit;
			}

			/* Universal styles for links and stuff */
		

			/* Responsive styles */
	
		</style>
	</head>
	<body id="body" style="margin: 0 !important; padding: 0 !important;">

	<!-- OUTER TABLE: full-width, centers the fixed inner table -->
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
		<tr>
			<td align="center" background="images/arena.jpg" style="padding:30px 0; background-image:url('images/arena.jpg'); background-size:cover; background-position:center; background-repeat:no-repeat;">

				<!-- INNER TABLE: single-column content, fixed at 600px -->
				<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;" align="center">

					<!-- Logo image -->
					<tr>
						<td align="center" style="padding:24px 0 8px 0; background-color:#ffffff;">
							<img src="Bayern-Munchen-Logo.png" alt="Bayern Munich logo" style="width:300px; height:auto; border:0;">
						</td>
					</tr>

					<!-- Headline -->
					<tr>
						<td align="center" style="padding:8px 20px; background-color:#ffffff;">
							<h1 style="color:#2c3e50; font-size:35px; margin:0;">Please donate to our cause</h1>
						</td>
					</tr>

					<!-- Hero Image -->
					<tr>
						<td align="center" style="background-color:#ffffff;">
							<!-- hero image goes here -->
						</td>
					</tr>

					<!-- Body copy -->
					<tr>
						<td align="left" style="padding:8px 20px; background-color:#ffffff;">
							<h1 style="color:#2c3e50; font-size:15px; margin:0;">Please consider a small donation to our club. Donations as small as 25k Euros are accepted!</h1>
						</td>
					</tr>

					<!-- Donate Button -->
					<tr>
						<td align="center" style="padding:20px 0; background-color:#ffffff;">
							<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center">
								<tr>
									<td align="center" style="padding: 20px 0;">
										<a href="https://fcbayern.com"
										   style="background-color:#1a73e8; border-radius:5px; color:#ffffff; display:inline-block; font-family:Arial,sans-serif; font-size:16px; font-weight:bold; line-height:50px; text-align:center; text-decoration:none; width:220px; -webkit-text-size-adjust:none;">
											Donate
										</a>
									</td>
								</tr>
							</table>
						</td>
					</tr>

					<!-- Footer information: Always include an unsubscribe link! -->
					<tr>
						<td align="center" style="padding:16px 20px; background-color:#ffffff;">
							<a href="#" style="color:#1a73e8; text-decoration:underline;">Unsubscribe</a>
						</td>
					</tr>

				</table>
				<!-- END INNER TABLE -->

			</td>
		</tr>
	</table>
	<!-- END OUTER TABLE -->

	</body>
</html>
